<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Rounded Square Background -->
  <rect width="512" height="512" rx="112" fill="#f6c344"/>
  
  <!-- Taxi Rooftop Sign -->
  <path d="M216 116h80l12 36h-104z" fill="#111827"/>
  <rect x="232" y="126" width="48" height="16" rx="4" fill="#ffffff"/>

  <!-- Car Roof & Windshield -->
  <path d="M148 236l28-84h160l28 84z" fill="#111827"/>
  <path d="M164 228l22-64h140l22 64z" fill="#ffffff" opacity="0.92"/>

  <!-- Car Main Body -->
  <rect x="108" y="228" width="296" height="124" rx="34" fill="#111827"/>

  <!-- Headlights -->
  <circle cx="160" cy="286" r="22" fill="#facc15"/>
  <circle cx="160" cy="286" r="14" fill="#ffffff"/>
  
  <circle cx="352" cy="286" r="22" fill="#facc15"/>
  <circle cx="352" cy="286" r="14" fill="#ffffff"/>

  <!-- Grille / Bumper Bar -->
  <rect x="216" y="280" width="80" height="12" rx="6" fill="#475467"/>
  <rect x="228" y="298" width="56" height="8" rx="4" fill="#334155"/>

  <!-- Checkerboard Accent Stripe -->
  <g fill="#f6c344">
    <rect x="212" y="244" width="14" height="12"/>
    <rect x="240" y="244" width="14" height="12"/>
    <rect x="268" y="244" width="14" height="12"/>
    <rect x="226" y="256" width="14" height="12"/>
    <rect x="254" y="256" width="14" height="12"/>
    <rect x="282" y="256" width="14" height="12"/>
  </g>

  <!-- Wheels / Ground Shadows -->
  <rect x="132" y="344" width="56" height="28" rx="10" fill="#030712"/>
  <rect x="324" y="344" width="56" height="28" rx="10" fill="#030712"/>
</svg>